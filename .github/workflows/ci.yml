name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    strategy:
      matrix:
        destination:
          - 'platform=iOS Simulator,name=iPhone 16,OS=latest'
          - 'platform=macOS'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build (macOS)
        run: swift build

      - name: Test (macOS)
        run: swift test

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme TGReduxKit \
            -destination "${{ matrix.destination }}" \
            -skipPackagePluginValidation \
            2>&1 || true

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint --strict
          else
            echo "SwiftLint not installed — skipping."
          fi
